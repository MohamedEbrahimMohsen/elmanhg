# Copy to deploy/alertmanager.yml on the host (chmod 600); never commit it (docs/observability.md, Alerts).
# The default receiver has no integrations: alerts are visible in Grafana and Alertmanager but sent nowhere.
route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  # routes:
  #   - receiver: email
  #     matchers: [severity="critical"]

receivers:
  - name: default

  # Email through Resend SMTP (the same Resend account as OTP email).
  # - name: email
