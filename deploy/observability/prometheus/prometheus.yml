# Prometheus: OTLP metrics pushed by the collector, blackbox probes pulled here (docs/observability.md).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

otlp:
  promote_resource_attributes: [deployment.environment.name]

storage:
  tsdb:
    out_of_order_time_window: 30m

rule_files: [/etc/prometheus/rules/*.yml]

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      # edge: Caddy -> API -> database, the path users take.
      - targets: [http://web:2080/api/health]
        labels:
          target_name: edge
      - targets: [http://api:8080/health]
        labels:
          target_name: api
      - targets: [http://ai:8000/health/ready]
        labels:
          target_name: ai
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
