# Staging / production stack, one environment per host (docs/deployment.md).
# Settings: .env (compose), api.env (API), ai.env (AI service) next to this file; none is committed.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    # The OTel collector reads this label to name each log stream (docs/observability.md, Logs).
    labels: "com.docker.compose.service"

# No service label: the collector drops these streams, so the telemetry stack never ingests its own logs.
x-observability-logging: &observability-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-image: &api-image ${IMAGE_REGISTRY:-ghcr.io/mohamedebrahimmohsen}/elmanhg-api:${IMAGE_TAG:?set IMAGE_TAG in .env}

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?set ASPNETCORE_ENVIRONMENT in .env}
  ConnectionStrings__DbConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:?set POSTGRES_DB in .env};Username=${POSTGRES_USER:?set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  ReverseProxy__TrustedNetworks__0: ${DOCKER_SUBNET:-172.30.0.0/24}
  AiService__BaseUrl: http://ai:8000
  FileStorage__LocalRootPath: /app/App_Data/media
  FileStorage__PublicBaseUrl: /api/media
  Observability__OtlpEndpoint: ${OTLP_ENDPOINT:-}
  Observability__ServiceVersion: ${IMAGE_TAG:?set IMAGE_TAG in .env}
  CoreLogging__Console__Format: Json

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  migrate:
    image: *api-image
    command: ["--MigrateAndExit=true"]
    restart: "no"
    env_file:
      - ${API_ENV_FILE:-api.env}
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  api:
    image: *api-image
    restart: unless-stopped
    env_file:
      - ${API_ENV_FILE:-api.env}
    environment: *api-environment
    volumes:
      - api-media:/app/App_Data/media
      - api-data-protection:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *logging

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/mohamedebrahimmohsen}/elmanhg-web:${IMAGE_TAG:?set IMAGE_TAG in .env}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

  ai:
    profiles: ["ai"]
    image: ${IMAGE_REGISTRY:-ghcr.io/mohamedebrahimmohsen}/elmanhg-ai:${IMAGE_TAG:?set IMAGE_TAG in .env}
    restart: unless-stopped
    env_file:
      - ${AI_ENV_FILE:-ai.env}
    environment:
      ELMANHG_AI_ENV: ${ELMANHG_AI_ENV:-production}
      ELMANHG_AI_OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      ELMANHG_AI_SERVICE_VERSION: ${IMAGE_TAG:?set IMAGE_TAG in .env}
      OTEL_SEMCONV_STABILITY_OPT_IN: http
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

  # Observability stack, opt-in through COMPOSE_PROFILES=...,observability (docs/observability.md).
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    restart: unless-stopped
    # Root reads the root-owned container log files; no port is published.
    user: "0:0"
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otel-collector-data:/var/lib/otelcol/file_storage
    depends_on:
      - prometheus
      - loki
      - tempo
    mem_limit: 256m
    logging: *observability-logging

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=35d", "--web.enable-otlp-receiver"]
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m
    logging: *observability-logging

  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./${ALERTMANAGER_CONFIG_FILE:-alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 64m
    logging: *observability-logging

  blackbox:
    profiles: ["observability"]
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9115/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 64m
    logging: *observability-logging

  # No health check: the image ships no wget or curl.
  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    mem_limit: 512m
    logging: *observability-logging

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.10.8@sha256:f0561deb1c68ec44d6e6e7e4487f30106c4e5e768642077695b37958b105812a
    restart: unless-stopped
    # The named volume is root-owned; the service is internal only.
    user: "0:0"
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: 512m
    logging: *observability-logging

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.1.6@sha256:d8276d620291d3aaae3e31dde6d63e6807afee49825f04e8aa7392bbe024216f
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    # Loopback only: reach it through ssh -L (docs/observability.md).
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      - prometheus
      - loki
      - tempo
      - alertmanager
    mem_limit: 256m
    logging: *observability-logging

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.0.0/24}

volumes:
  postgres-data:
  api-media:
  api-data-protection:
  caddy-data:
  caddy-config:
  otel-collector-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  grafana-data:
