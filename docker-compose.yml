services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: elmanhg-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elmanhg}
      POSTGRES_USER: ${POSTGRES_USER:-elmanhg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - elmanhg-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  ai:
    profiles: ["ai"]
    build: ./ai
    image: elmanhg-ai:local
    container_name: elmanhg-ai
    environment:
      ELMANHG_AI_ENV: development
      ELMANHG_AI_SERVICE_TOKEN: ${ELMANHG_AI_SERVICE_TOKEN:-}
      ELMANHG_AI_LLM_PROVIDER: ${ELMANHG_AI_LLM_PROVIDER:-fake}
      ELMANHG_AI_ANTHROPIC_API_KEY: ${ELMANHG_AI_ANTHROPIC_API_KEY:-}
      ELMANHG_AI_CHAT_MODEL: ${ELMANHG_AI_CHAT_MODEL:-claude-sonnet-5}
      ELMANHG_AI_EMBEDDING_PROVIDER: ${ELMANHG_AI_EMBEDDING_PROVIDER:-fake}
      ELMANHG_AI_OPENAI_API_KEY: ${ELMANHG_AI_OPENAI_API_KEY:-}
      ELMANHG_AI_EMBEDDING_MODEL: ${ELMANHG_AI_EMBEDDING_MODEL:-text-embedding-3-small}
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  elmanhg-postgres-data:
