  python:
    root:    ai/
    build:   ruff check ai/ && python -m compileall ai/
    test:    pytest ai/
    style:   .claude/skills/python-feature/SKILL.md
    testing: .claude/conventions/python-testing.md
    ui:      false
    tests:
      unit:     { on: true }
      postman:  { on: true,  assert: true, collection: postman/ai.postman_collection.json, environment: postman/local.postman_environment.json, run: "" }
      e2e:      { on: false, start: "uvicorn ai.main:app --port 8000", url: http://localhost:8000/docs }   # Agy opens url and walks the plan's scenarios
      coverage: { on: false, cmd: 'pytest ai/ --cov=ai --cov-report=term', min: 80 }
    security:
      packages:         { on: true,  cmd: "pip-audit -r ai/requirements.txt" }
      secrets:          { on: true,  cmd: "gitleaks detect --no-git -s ai/" }
      sast:             { on: false, cmd: "semgrep --config auto --error ai/" }
      prompt-injection: { on: false }           # agent pass; turn on where this stack builds LLM prompts from user input
