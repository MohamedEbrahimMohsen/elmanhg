# .claude/pipeline.yml — the ONLY file a dev edits to control /feature in this repo.
#
# How to read it
#   stacks     every technology in this repo. The agents detect which ones a task touches; you never declare it.
#              Every stack has the SAME keys. Turn a feature on or off per stack. Delete stacks you don't have.
#   tests      unit · postman · e2e (Agy) · coverage — per stack
#   security   packages · secrets · sast · prompt-injection — per stack
#   steps      the global switch for each step, and which model runs it.
#              A feature runs only if its step is on AND the stack's switch is on AND the plan gate didn't turn it off.
#              A step with a model is its own run; a step without one is a command or a flag inside the step above it.
#   gates      human decisions. Cannot be turned off.
#   implement  always on. opencode → OpenCode CLI; opus | sonnet → Claude. Personal choice → .claude/pipeline.local.yml (gitignored).

stacks:
  dotnet:
    root:    api/
    build:   dotnet build api/
    test:    dotnet test api/
    style:   .claude/skills/dotnet-feature/SKILL.md
    testing: .claude/conventions/dotnet-testing.md
    ui:      false
    tests:
      unit:     { on: true }
      postman:  { on: true,  assert: true, collection: postman/myapp.postman_collection.json, environment: postman/local.postman_environment.json, run: "" }
      e2e:      { on: false, start: "dotnet run --project api/", url: http://localhost:5000/swagger }   # Agy opens url and walks the plan's scenarios
      coverage: { on: false, cmd: 'dotnet test api/ --collect:"XPlat Code Coverage"', min: 80 }   # SonarQube: dotnet sonarscanner begin … && dotnet build && dotnet test && dotnet sonarscanner end
    security:
      packages:         { on: true,  cmd: "dotnet list api/ package --vulnerable --include-transitive" }
      secrets:          { on: true,  cmd: "gitleaks detect --no-git -s api/" }
      sast:             { on: false, cmd: "semgrep --config auto --error api/" }
      prompt-injection: { on: false }           # agent pass; turn on where this stack builds LLM prompts from user input
  react:
    root:    web/
    build:   npm --prefix web run build
    test:    npm --prefix web test -- --run
    style:   .claude/skills/react-feature/SKILL.md
    testing: .claude/conventions/react-testing.md
    ui:      true                                  # true → design system + Figma required
    tests:
      unit:     { on: true }
      postman:  { on: false }                     # no HTTP API in this stack
      e2e:      { on: false, start: "npm --prefix web run dev", url: http://localhost:5173 }   # Agy opens url and walks the plan's scenarios
      coverage: { on: false, cmd: 'npm --prefix web test -- --run --coverage', min: 70 }
    security:
      packages:         { on: true,  cmd: "npm --prefix web audit --audit-level=high" }
      secrets:          { on: true,  cmd: "gitleaks detect --no-git -s web/" }
      sast:             { on: false, cmd: "semgrep --config auto --error web/" }
      prompt-injection: { on: false }           # agent pass; turn on where this stack builds LLM prompts from user input
  node:
    root:    services/
    build:   npm --prefix services run build
    test:    npm --prefix services test
    style:   .claude/skills/node-feature/SKILL.md
    testing: .claude/conventions/node-testing.md
    ui:      false
    tests:
      unit:     { on: true }
      postman:  { on: true,  assert: true, collection: postman/services.postman_collection.json, environment: postman/local.postman_environment.json, run: "" }
      e2e:      { on: false, start: "npm --prefix services run start", url: http://localhost:3000/health }   # Agy opens url and walks the plan's scenarios
      coverage: { on: false, cmd: 'npm --prefix services test -- --coverage', min: 70 }
    security:
      packages:         { on: true,  cmd: "npm --prefix services audit --audit-level=high" }
      secrets:          { on: true,  cmd: "gitleaks detect --no-git -s services/" }
      sast:             { on: false, cmd: "semgrep --config auto --error services/" }
      prompt-injection: { on: false }           # agent pass; turn on where this stack builds LLM prompts from user input
  flutter:
    root:    mobile/
    build:   cd mobile/ && flutter build apk --debug
    test:    cd mobile/ && flutter test
    style:   .claude/skills/flutter-feature/SKILL.md
    testing: .claude/conventions/flutter-testing.md
    ui:      true                                  # true → design system + Figma required
    tests:
      unit:     { on: true }
      postman:  { on: false }                     # no HTTP API in this stack
      e2e:      { on: false, start: "cd mobile/ && flutter run -d web-server --web-port 8080", url: http://localhost:8080 }   # Agy opens url and walks the plan's scenarios
      coverage: { on: false, cmd: 'cd mobile/ && flutter test --coverage', min: 70 }
    security:
      packages:         { on: true,  cmd: "osv-scanner --lockfile mobile/pubspec.lock" }
      secrets:          { on: true,  cmd: "gitleaks detect --no-git -s mobile/" }
      sast:             { on: false, cmd: "semgrep --config auto --error mobile/" }
      prompt-injection: { on: false }           # agent pass; turn on where this stack builds LLM prompts from user input
  kmp:
    root:    kmp/
    build:   cd kmp/ && ./gradlew build
    test:    cd kmp/ && ./gradlew allTests
    style:   .claude/skills/kmp-feature/SKILL.md
    testing: .claude/conventions/kmp-testing.md
    ui:      true                                  # true → design system + Figma required
    tests:
      unit:     { on: true }
      postman:  { on: false }                     # no HTTP API in this stack
      e2e:      { on: false, start: "cd kmp/ && ./gradlew :composeApp:wasmJsBrowserDevelopmentRun", url: http://localhost:8080 }   # Agy opens url and walks the plan's scenarios
      coverage: { on: false, cmd: 'cd kmp/ && ./gradlew koverXmlReport', min: 70 }
    security:
      packages:         { on: true,  cmd: "osv-scanner -r kmp/" }
      secrets:          { on: true,  cmd: "gitleaks detect --no-git -s kmp/" }
      sast:             { on: false, cmd: "semgrep --config auto --error kmp/" }
      prompt-injection: { on: false }           # agent pass; turn on where this stack builds LLM prompts from user input
  python:
    root:    ai/
    build:   ruff check ai/ && python -m compileall ai/
    test:    pytest ai/
    style:   .claude/skills/python-feature/SKILL.md
    testing: .claude/conventions/python-testing.md
    ui:      false
    tests:
      unit:     { on: true }
      postman:  { on: true,  assert: true, collection: postman/ai.postman_collection.json, environment: postman/local.postman_environment.json, run: "" }
      e2e:      { on: false, start: "uvicorn ai.main:app --port 8000", url: http://localhost:8000/docs }   # Agy opens url and walks the plan's scenarios
      coverage: { on: false, cmd: 'pytest ai/ --cov=ai --cov-report=term', min: 80 }
    security:
      packages:         { on: true,  cmd: "pip-audit -r ai/requirements.txt" }
      secrets:          { on: true,  cmd: "gitleaks detect --no-git -s ai/" }
      sast:             { on: false, cmd: "semgrep --config auto --error ai/" }
      prompt-injection: { on: false }           # agent pass; turn on where this stack builds LLM prompts from user input
  python-flask:
    root:    flaskapp/
    build:   ruff check flaskapp/ && mypy flaskapp/
    test:    pytest flaskapp/
    style:   .claude/skills/python-flask-feature/SKILL.md
    testing: .claude/conventions/python-flask-testing.md
    ui:      false
    tests:
      unit:     { on: true }
      postman:  { on: true,  assert: true, collection: postman/flaskapp.postman_collection.json, environment: postman/local.postman_environment.json, run: "" }
      e2e:      { on: false, start: "flask --app flaskapp run --port 5001", url: http://localhost:5001 }   # Agy opens url and walks the plan's scenarios
      coverage: { on: false, cmd: 'pytest flaskapp/ --cov=flaskapp --cov-report=term', min: 80 }
    security:
      packages:         { on: true,  cmd: "pip-audit -r flaskapp/requirements.txt" }
      secrets:          { on: true,  cmd: "gitleaks detect --no-git -s flaskapp/" }
      sast:             { on: false, cmd: "semgrep --config auto --error flaskapp/" }
      prompt-injection: { on: false }           # agent pass; turn on where this stack builds LLM prompts from user input
  python-django:
    root:    djangoapp/
    build:   ruff check djangoapp/ && python djangoapp/manage.py check
    test:    pytest djangoapp/
    style:   .claude/skills/python-django-feature/SKILL.md
    testing: .claude/conventions/python-django-testing.md
    ui:      false
    tests:
      unit:     { on: true }
      postman:  { on: true,  assert: true, collection: postman/djangoapp.postman_collection.json, environment: postman/local.postman_environment.json, run: "" }
      e2e:      { on: false, start: "python djangoapp/manage.py runserver 8001", url: http://localhost:8001 }   # Agy opens url and walks the plan's scenarios
      coverage: { on: false, cmd: 'pytest djangoapp/ --cov=djangoapp --cov-report=term', min: 80 }
    security:
      packages:         { on: true,  cmd: "pip-audit -r djangoapp/requirements.txt" }
      secrets:          { on: true,  cmd: "gitleaks detect --no-git -s djangoapp/" }
      sast:             { on: false, cmd: "semgrep --config auto --error djangoapp/" }
      prompt-injection: { on: false }           # agent pass; turn on where this stack builds LLM prompts from user input

design:                                            # read only when a touched stack has ui: true
  system:    .claude/design-system.md              # tokens + rules from the UI/UX team. Missing → UI work stops.
  figma:     required                              # required | optional
  figma_mcp: false                                 # true → the planner reads frames itself; false → export PNGs

implementer:                                       # used when a step says model: opencode
  model: litellm/deepseek-flash#high
  cmd:   opencode run -m "{model}" "$(cat {prompt})"

agy:                                               # Antigravity · runs E2E · used when a step says model: agy
  model: "Gemini 3.8 Flash (High)"
  cmd:   agy --model "{model}" --dangerously-skip-permissions -p "$(cat {prompt})"
  ready_timeout: 120                               # seconds to wait for the app's url before failing

github:
  base:        main
  pr_reviewer: pr-agent

triage:
  memory:     .claude/triage-memory.md
  promote_at: 3

steps:
  split:        { on: true,  model: opus,     effort: medium }
  split-gate:   { gate: dev }
  explore:      { on: true,  model: sonnet,   effort: medium }   # also detects stacks
  design-gate:  { gate: dev }                                    # UI stacks: design system + Figma
  plan:         { on: true,  model: opus,     effort: medium }
  plan-gate:    { gate: dev }                                    # you can override any test/security switch here, for this task only
  implement:    { model: opencode }                              # always on · once per stack · unit tests written here when tests.unit.on
  postman:      { on: true,  model: opencode }                   # collection sync (+ pm.test when tests.postman.assert)
  style-check:  { on: true,  model: sonnet,   effort: medium }
  coverage:     { on: true }                                     # command · below min = blocking
  security:     { on: true,  model: opus,     effort: medium, fail_on: high }   # commands + prompt-injection agent · findings ≥ fail_on = blocking
  e2e:          { on: true,  model: agy }                        # starts the app, Agy walks the scenarios · failures = blocking
  review:       { on: true,  model: opus,     effort: medium, max_rounds: 2 }
  pr:           { on: true,  draft: true }
  collect:      { on: true,  model: sonnet,   effort: medium }
  triage:       { on: true,  model: opus,     effort: medium, max_cycles: 2 }
  pr-gate:      { gate: dev+peer }
