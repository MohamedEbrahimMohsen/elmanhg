<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تذكير بسؤال طالب</title>
</head>
<body style="margin:0;padding:24px;background:#f6f6f8;font-family:Tahoma,Arial,sans-serif;direction:rtl;text-align:right;color:#1d1d24;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
<tr>
<td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;">
<tr>
<td style="padding:24px;">
<h1 style="font-size:20px;">تذكير بسؤال طالب</h1>
<p>مرحبًا {{name}}،</p>
<p>سؤال طالب في {{subject}} (درس {{lesson}}) بانتظار ردك.</p>
<p>موعد الرد: <span dir="ltr">{{deadline}}</span></p>
<p style="text-align:center;"><a href="{{link}}" style="display:inline-block;padding:12px 20px;background:#1d1d1f;color:#ffffff;border-radius:999px;text-decoration:none;">فتح السؤال</a></p>
<p dir="ltr" style="font-size:12px;color:#6b6b76;word-break:break-all;">{{link}}</p>
<p style="color:#6b6b76;">هذا هو التذكير الوحيد خارج التطبيق لهذا السؤال.</p>
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
