<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>A student question is waiting</title>
</head>
<body style="margin:0;padding:24px;background:#f6f6f8;font-family:Tahoma,Arial,sans-serif;direction:ltr;text-align:left;color:#1d1d24;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
<tr>
<td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;">
<tr>
<td style="padding:24px;">
<h1 style="font-size:20px;">A student question is waiting</h1>
<p>Hello {{name}},</p>
<p>A student question in {{subject}} (lesson {{lesson}}) is waiting for your reply.</p>
<p>Reply by: {{deadline}}</p>
<p style="text-align:center;"><a href="{{link}}" style="display:inline-block;padding:12px 20px;background:#1d1d1f;color:#ffffff;border-radius:999px;text-decoration:none;">Open the question</a></p>
<p style="font-size:12px;color:#6b6b76;word-break:break-all;">{{link}}</p>
<p style="color:#6b6b76;">This is the only out-of-app reminder for this question.</p>
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
