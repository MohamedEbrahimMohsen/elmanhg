name: images

on:
  pull_request:
    paths:
      - 'api/**'
      - 'web/**'
      - 'ai/**'
      - 'deploy/**'
      - 'global.json'
      - '.dockerignore'
      - '.github/workflows/images.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR runs share a group per ref and cancel each other. Main runs get a group per commit:
# a shared group would still drop a queued run when a third push arrives, and that commit would get no images.
concurrency:
  group: images-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Whole-stack smoke test (build, migrate, serve, backup, restore drill)
        run: bash deploy/smoke-test.sh
      # Reuses the local/elmanhg-*:smoke images the smoke step built (docs/performance.md §5).
      - name: Load test smoke (k6 API budgets + throttled lesson page)
        run: bash deploy/load-test.sh
        env:
          LOAD_SKIP_BUILD: '1'
          LOAD_IMAGE_TAG: smoke
          LOAD_PROFILE: smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: load-test-smoke
          path: deploy/.loadtest-results

  publish:
    needs: deploy-smoke
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: elmanhg-api, context: ., file: api/Dockerfile }
          - { image: elmanhg-web, context: web, file: web/Dockerfile }
          - { image: elmanhg-ai, context: ai, file: ai/Dockerfile }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
